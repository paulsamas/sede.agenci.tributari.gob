<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B7A6A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<title>LogicLineLearning</title>

<style>
:root{
  --bg:#F4EFE4; --surface:#FCF8F0; --surface-2:#EFE7D8;
  --ink:#29302A; --muted:#837C6E; --line:#E4DACA;
  --pino:#1B7A6A; --pino-soft:#E2F0EC;
  --ocre:#C68A21; --ocre-soft:#F7EBD0;
  --arcilla:#C06A4A; --arcilla-soft:#F5E3D9;
  --ciruela:#7A5C84; --ciruela-soft:#ECE4F0;
  --salvia:#6E8A5B; --salvia-soft:#E8EEDF;
  --radius:18px; --radius-sm:12px;
  --shadow:0 6px 22px rgba(41,48,42,.07);
  --shadow-lg:0 14px 40px rgba(41,48,42,.12);
  --font-display:'Bricolage Grotesque',system-ui,sans-serif;
  --font-body:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;overscroll-behavior-y:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
svg{display:block}
.hidden{display:none!important}

.app-shell{max-width:760px;margin:0 auto;min-height:100%;position:relative}
.screen{min-height:100vh;display:flex;flex-direction:column}
.pad{padding:20px}
.section-title{font-family:var(--font-display);font-weight:800;font-size:1.15rem;letter-spacing:-.01em;margin:6px 0 14px;display:flex;align-items:center;gap:9px}

.landing{background:radial-gradient(680px 360px at 92% -8%, var(--pino-soft), transparent 60%),radial-gradient(520px 320px at -8% 6%, var(--ocre-soft), transparent 60%),var(--bg)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 20px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:1.12rem;letter-spacing:-.02em}
.lang-toggle{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.lang-toggle button{padding:6px 12px;border-radius:999px;font-weight:700;font-size:.82rem;color:var(--muted)}
.lang-toggle button.active{background:var(--pino);color:#fff}
.hero{padding:18px 24px 8px}
.hero .eyebrow{display:inline-block;background:var(--ocre-soft);color:#6E4A0E;font-weight:700;font-size:.74rem;letter-spacing:.04em;text-transform:uppercase;padding:6px 12px;border-radius:999px}
.hero h1{font-family:var(--font-display);font-weight:800;font-size:2.1rem;line-height:1.05;letter-spacing:-.025em;margin:16px 0 12px}
.hero h1 .hl{color:var(--pino)}
.hero p{color:var(--muted);font-size:1.02rem;max-width:46ch}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 4px}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-weight:600;font-size:.82rem;box-shadow:var(--shadow);display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--pino);flex:none}
.cta-stack{padding:22px 24px 30px;display:flex;flex-direction:column;gap:11px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;padding:15px 18px;border-radius:14px;font-weight:700;font-size:1rem;transition:transform .12s ease,box-shadow .12s ease}
.btn:active{transform:translateY(1px) scale(.995)}
.btn-primary{background:var(--pino);color:#fff;box-shadow:0 8px 20px rgba(27,122,106,.30)}
.btn-accent{background:var(--arcilla);color:#fff;box-shadow:0 8px 20px rgba(192,106,74,.28)}
.btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow)}
.btn-block{width:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.notif-panel{padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.notif-item{display:flex;gap:11px;padding:11px 0;border-bottom:1px dashed var(--line)}
.notif-item:last-child{border-bottom:none}
.notif-dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.notif-item small{color:var(--muted)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.course-card{padding:16px;border-radius:var(--radius);text-align:left;display:flex;flex-direction:column;gap:10px;min-height:128px;transition:transform .12s ease,box-shadow .12s ease;color:var(--ink)}
.course-card:active{transform:translateY(1px)}
.course-card:hover{box-shadow:var(--shadow-lg)}
.course-ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center}
.course-card h3{font-family:var(--font-display);font-weight:700;font-size:.98rem;line-height:1.15;letter-spacing:-.01em}
.course-card .meta{margin-top:auto;font-size:.76rem;color:var(--muted);font-weight:600}
.progress{height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.progress > span{display:block;height:100%;border-radius:999px}

.feature{display:flex;align-items:center;gap:14px;padding:16px;width:100%;text-align:left;border-radius:var(--radius)}
.feature .fic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none}
.feature h3{font-family:var(--font-display);font-weight:700;font-size:1.02rem}
.feature p{color:var(--muted);font-size:.86rem}
.feature .chev{margin-left:auto;color:var(--muted);display:flex}

.app-header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:rgba(244,239,228,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.h-left{display:flex;align-items:center;gap:11px}
.greet{font-family:var(--font-display);font-weight:800;font-size:1.02rem;letter-spacing:-.01em}
.greet small{display:block;font-family:var(--font-body);font-weight:600;font-size:.74rem;color:var(--muted)}
.h-actions{display:flex;align-items:center;gap:9px}
.icon-btn{width:38px;height:38px;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;box-shadow:var(--shadow);color:var(--ink)}

.content{flex:1;padding:18px 20px 110px}

.bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:min(94%,420px);background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);display:flex;justify-content:space-around;padding:8px;z-index:40}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 12px;border-radius:13px;color:var(--muted);font-size:.68rem;font-weight:700}
.nav-btn.active{color:var(--pino);background:var(--pino-soft)}

.overlay{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column;overflow:auto}
.overlay-head{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:14px 18px;background:rgba(244,239,228,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.back-btn{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--pino)}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:13px;box-shadow:var(--shadow)}
.lesson h4{font-family:var(--font-display);font-weight:700;font-size:1.02rem;margin-bottom:8px}
.lesson p{color:#3C463E;font-size:.94rem;margin-bottom:9px}
.lesson ul{margin:6px 0 6px 18px;color:#3C463E;font-size:.92rem}
.lesson li{margin-bottom:5px}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:999px;margin-bottom:10px}

.field{margin-bottom:13px}
.field label{display:block;font-weight:700;font-size:.84rem;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--pino);box-shadow:0 0 0 3px var(--pino-soft)}
.field textarea{min-height:78px;resize:vertical}
.modal-bg{position:fixed;inset:0;background:rgba(41,48,42,.42);z-index:80;display:grid;place-items:end center}
.modal{background:var(--surface);width:100%;max-width:760px;border-radius:22px 22px 0 0;padding:22px 20px 28px;box-shadow:var(--shadow-lg);max-height:92vh;overflow:auto;animation:slideUp .22s ease}
@keyframes slideUp{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.modal h3{font-family:var(--font-display);font-weight:800;font-size:1.2rem;margin-bottom:4px}
.modal .sub{color:var(--muted);font-size:.88rem;margin-bottom:16px}

.scn-brief{background:var(--ciruela-soft);border:1px solid #DCD0E2;border-radius:var(--radius);padding:16px;margin-bottom:14px}
.scn-brief .label{font-weight:800;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ciruela)}
.doc-block{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:15px;margin-bottom:13px}
.doc-block .doc-tag{font-family:var(--font-display);font-weight:800;color:var(--pino);font-size:.9rem;margin-bottom:10px}
.feedback{border-radius:var(--radius);padding:16px;margin-top:6px}
.feedback.ok{background:var(--pino-soft);border:1px solid #BEE0D5}
.feedback.warn{background:var(--ocre-soft);border:1px solid #EBD9AE}
.feedback h4{font-family:var(--font-display);margin-bottom:7px;display:flex;align-items:center;gap:8px}
.feedback.ok h4{color:#0F5D4F}
.feedback.warn h4{color:#6E4A0E}
.feedback p{font-size:.9rem;color:#3C463E}

.post{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:11px;box-shadow:var(--shadow)}
.post .who{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.85rem;flex:none}
.post .who b{font-size:.9rem}
.post .who small{color:var(--muted);font-size:.74rem;display:block}
.post p{font-size:.92rem;color:#3C463E}
.composer{display:flex;gap:9px;align-items:flex-end;margin-bottom:14px}
.composer textarea{flex:1;min-height:46px}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:13px;font-weight:600;font-size:.9rem;box-shadow:var(--shadow-lg);z-index:120;opacity:0;transition:opacity .25s, transform .25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

@media(min-width:600px){
  .hero h1{font-size:2.5rem}
  .grid{grid-template-columns:1fr 1fr 1fr}
}
</style>
</head>

/* ----------------------------- Persistencia (localStorage) -----------------------------
   Guarda los usuarios registrados y la sesion en el dispositivo, para que NO
   haya que crear el usuario en cada apertura. Fase 1: esto pasara a Supabase. */
const LS_KEY = "lll_db";
function loadLS(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return { users:[], session:null };
    const d = JSON.parse(raw);
    return { users: Array.isArray(d.users)?d.users:[], session: d.session||null };
  }catch(e){ return { users:[], session:null }; }
}
function saveLS(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      users: STATE.nuevos,
      session: STATE.user ? STATE.user.email : null
    }));
  }catch(e){ toast(LANG==='es'?"No se pudo guardar (almacenamiento lleno).":"Could not save (storage full)."); }
}

const $ = (sel,root=document)=> root.querySelector(sel);
const app = ()=> document.getElementById("app");
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),2200);
}
function initials(name){ return name.split(" ").slice(0,2).map(w=>w[0]||"").join("").toUpperCase(); }

/* ----------------------------- Modales ----------------------------- */
function openModal(html){
  const bg=document.createElement("div"); bg.className="modal-bg";
  bg.innerHTML=`<div class="modal">${html}</div>`;
  bg.addEventListener("click",e=>{ if(e.target===bg) bg.remove(); });
  bg.querySelectorAll(".modal input").forEach(inp=>{
    inp.addEventListener("keydown", e=>{
      if(e.key==="Enter"){ e.preventDefault(); const b=bg.querySelector(".modal .btn"); if(b) b.click(); }
    });
  });
  document.body.appendChild(bg);
  return bg;
}

    <div class="field"><label>${esc(t("login_pass"))}</label><input id="li-pass" type="password" placeholder="demo"></div>
    <button class="btn btn-primary btn-block" id="li-go">${esc(t("login_btn"))}</button>`);
  $("#li-go",bg).onclick=()=>{
    const email=$("#li-email",bg).value.trim();
    const user=DB.findUserByEmail(email);
    if(!user){ toast(t("login_err")); return; }
    STATE.user=user; saveLS(); bg.remove(); enterApp();
  };
}
function openRegister(){
  const bg=openModal(`
    <h3>${esc(t("reg_h"))}</h3>
    <p class="sub">${esc(t("reg_note"))}</p>
    <div class="field"><label>${esc(t("reg_name"))}</label><input id="rg-name" type="text"></div>
    <div class="field"><label>${esc(t("reg_email"))}</label><input id="rg-email" type="email" inputmode="email"></div>
    <div class="field"><label>${esc(t("reg_pass"))}</label><input id="rg-pass" type="password"></div>
    <button class="btn btn-accent btn-block" id="rg-go">${esc(t("reg_btn"))}</button>`);
  $("#rg-go",bg).onclick=()=>{
    const name=$("#rg-name",bg).value.trim(), email=$("#rg-email",bg).value.trim();
    if(!name||!email){ toast(t("need_field")); return; }
    DB.register({id:"u"+Date.now(), nombre:name, email:email, tipo:"—", nac:"—", dni:"—", fnac:"—", tel:"—"});
    bg.remove(); toast(t("saved_reg"));
  };
}
function openRequest(){
  const bg=openModal(`
    <h3>${esc(t("req_h"))}</h3>
    <p class="sub">${esc(t("req_note"))}</p>
    <div class="field"><label>${esc(t("req_name"))}</label><input id="rq-name" type="text"></div>
    <div class="field"><label>${esc(t("req_email"))}</label><input id="rq-email" type="email" inputmode="email"></div>
    <div class="field"><label>${esc(t("req_msg"))}</label><textarea id="rq-msg"></textarea></div>
    <button class="btn btn-primary btn-block" id="rq-go">${esc(t("req_btn"))}</button>`);
  $("#rq-go",bg).onclick=()=>{
    if(!$("#rq-email",bg).value.trim()){ toast(t("need_field")); return; }
    bg.remove(); toast(t("saved_req"));
  };
}

/* ----------------------------- App ----------------------------- */
function enterApp(){ STATE.tab="home"; renderApp(); }
function renderApp(){
  app().innerHTML = `
  <div class="screen">
    <div class="app-header">
      <div class="h-left">${logoMark(30)}
        <div class="greet">${esc(t("greeting"))}, ${esc(STATE.user.nombre.split(" ")[0])}
          <small>${esc(STATE.user.tipo!=="—"?("Type rating · "+STATE.user.tipo):"LogicLineLearning")}</small></div>
      </div>
      <div class="h-actions">
        ${langToggleHTML()}
        <button class="icon-btn" id="logout" aria-label="${esc(t("logout"))}">${ic("logout",20)}</button>
      </div>
    </div>
    <div class="content" id="content"></div>
    <div class="bottom-nav">
      ${navBtn("home","home",t("home"))}
      ${navBtn("courses","book",t("courses"))}
      ${navBtn("simulator","target",t("simulator"))}
      ${navBtn("forum","chat",t("forum"))}
    </div>
  </div>`;
  bindLangToggle();
  $("#logout").onclick=()=>{ STATE.user=null; saveLS(); renderLanding(); };
  document.querySelectorAll(".nav-btn").forEach(b=> b.onclick=()=>{ STATE.tab=b.dataset.tab; renderTab(); });
  renderTab();
}
function navBtn(tab,icon,label){
  return `<button class="nav-btn ${STATE.tab===tab?'active':''}" data-tab="${tab}">${ic(icon,24)}${esc(label)}</button>`;
}
function renderTab(){
  document.querySelectorAll(".nav-btn").forEach(b=> b.classList.toggle("active", b.dataset.tab===STATE.tab));
  const c=$("#content");
  if(STATE.tab==="home") c.innerHTML=viewHome();
  else if(STATE.tab==="courses") c.innerHTML=viewCourses();
  else if(STATE.tab==="simulator") c.innerHTML=viewSimulator();
  else if(STATE.tab==="forum"){ c.innerHTML=viewForum(); bindForum(); }
  bindCards();
}
function titleBar(icon,color,label){
  return `<div class="section-title"><span style="color:${color};display:flex">${ic(icon,20)}</span>${esc(label)}</div>`;
}

/* ---------- Vistas ---------- */
function viewHome(){
  const n=DB.notifs();
  const cursos=DB.cursos().slice(0,4);
  return `
    ${titleBar("bell","var(--ocre)",t("notifs"))}
    <div class="notif-panel">
      ${n.map(x=>{const c=x[LANG]||x.es;return `<div class="notif-item"><span class="notif-dot" style="background:${x.color}"></span><div><b>${esc(c[0])}</b><br><small>${esc(c[1])}</small></div></div>`;}).join("")}
    </div>
    <div style="margin-top:24px">${titleBar("book","var(--pino)",t("guides"))}</div>
    <div class="grid">${cursos.map(courseCardHTML).join("")}</div>
    <div style="margin-top:24px">${titleBar("target","var(--ciruela)",t("simulator"))}</div>
    <button class="feature card" data-go="simulator" style="margin-bottom:12px">
      <span class="fic" style="background:var(--ciruela-soft);color:var(--ciruela)">${ic("target",24)}</span>
      <div><h3>${esc(t("sim_title"))}</h3><p>${esc(t("sim_sub"))}</p></div><span class="chev">${ic("chevright",20)}</span>
    </button>
    <button class="feature card" data-go="forum">
      <span class="fic" style="background:var(--salvia-soft);color:var(--salvia)">${ic("chat",24)}</span>
      <div><h3>${esc(t("forum_title"))}</h3><p>${esc(t("forum_sub"))}</p></div><span class="chev">${ic("chevright",20)}</span>
    </button>`;
}
function courseCardHTML(c){
  const L=c[LANG]||c.es;
  const lessons=c.lessons[LANG]||c.lessons.es;
  return `<button class="course-card card" data-course="${c.id}" style="background:${c.soft}">
    <span class="course-ic" style="background:var(--surface);color:${c.color}">${ic(c.icon,24)}</span>
    <h3>${esc(L.t)}</h3>
    <div class="progress"><span style="width:${c.prog}%;background:${c.color}"></span></div>
    <div class="meta">${c.prog>0?(t("progress")+" "+c.prog+"%"):(lessons.length+" "+t("lessons"))}</div>
  </button>`;
}
function viewCourses(){
  return `${titleBar("book","var(--pino)",t("guides"))}
    <div class="grid">${DB.cursos().map(courseCardHTML).join("")}</div>`;
}
function viewSimulator(){
  return `${titleBar("target","var(--ciruela)",t("sim_title"))}
    <p style="color:var(--muted);margin-bottom:14px;font-size:.92rem">${esc(t("sim_sub"))}</p>
    ${DB.escenarios().map(e=>{const L=e[LANG]||e.es;return `
      <button class="feature card" data-scn="${e.id}" style="margin-bottom:12px">
        <span class="fic" style="background:${e.color};color:#fff">${ic(e.icon,24)}</span>
        <div><h3>${esc(L.t)}</h3><p>WO · ATL · HIL · MEL</p></div><span class="chev">${ic("chevright",20)}</span>
      </button>`;}).join("")}`;
}
function viewForum(){
  const posts=DB.foro();
  return `${titleBar("chat","var(--salvia)",t("forum_intro"))}
    <div class="composer">
      <textarea id="fp-text" placeholder="${esc(t("write_here"))}"></textarea>
      <button class="btn btn-primary" id="fp-send" style="padding:13px 15px">${ic("send",20)}</button>
    </div>
    <div id="forum-list">${posts.map(postHTML).join("")}</div>`;
}
function postHTML(p){
  const body=p[LANG]||p.es||p.body;
  return `<div class="post">
    <div class="who"><span class="avatar" style="background:${p.color||'var(--pino)'}">${esc(initials(p.who))}</span>
      <div><b>${esc(p.who)}</b><small>${esc(p.t||"")}</small></div></div>
    <p>${esc(body)}</p></div>`;
}

/* ---------- Navegación interna ---------- */
function bindCards(){
  document.querySelectorAll("[data-course]").forEach(b=> b.onclick=()=>openCourse(b.dataset.course));
  document.querySelectorAll("[data-scn]").forEach(b=> b.onclick=()=>openScenario(b.dataset.scn));
  document.querySelectorAll("[data-go]").forEach(b=> b.onclick=()=>{ STATE.tab=b.dataset.go; renderTab(); });
}
function bindForum(){
  const send=$("#fp-send");
  if(send) send.onclick=()=>{
    const ta=$("#fp-text"); const v=ta.value.trim();
    if(!v) return;
    DB.addForo({who:STATE.user.nombre, color:"var(--pino)", t:LANG==='es'?"ahora":"now", es:v, en:v});
    $("#forum-list").innerHTML = DB.foro().map(postHTML).join("");
    ta.value=""; toast(t("posted"));
  };
}

/* ---------- Detalle de curso ---------- */
function openCourse(id){
  const c=DB.curso(id); if(!c) return;
  const L=c[LANG]||c.es; const lessons=c.lessons[LANG]||c.lessons.es; const next=c.next[LANG]||c.next.es;
  const ov=document.createElement("div"); ov.className="overlay";
  ov.innerHTML=`
    <div class="overlay-head"><button class="back-btn" id="ov-back">${ic("chevleft",20)} ${esc(t("back"))}</button></div>
    <div class="pad">
      <span class="course-ic" style="background:${c.soft};color:${c.color};margin-bottom:10px">${ic(c.icon,24)}</span>
      <h2 style="font-family:var(--font-display);font-weight:800;font-size:1.45rem;letter-spacing:-.02em;margin:8px 0 4px">${esc(L.t)}</h2>
      <p style="color:var(--muted);margin-bottom:18px">${esc(L.d)}</p>
      ${lessons.map(ls=>`
        <div class="lesson">
          <span class="tag" style="background:${c.soft};color:${c.color}">${esc(t("lesson_tag"))}</span>
          <h4>${esc(ls.h)}</h4>
          <p>${esc(ls.p)}</p>
          <ul>${ls.ul.map(li=>`<li>${esc(li)}</li>`).join("")}</ul>
          <p style="font-style:italic;color:${c.color}">${esc(ls.end)}</p>
        </div>`).join("")}
      <div class="lesson" style="background:var(--surface-2)">
        <h4 style="display:flex;align-items:center;gap:8px"><span style="display:flex;color:var(--pino)">${ic("arrowright",20)}</span>${esc(t("lesson_more"))}</h4>
        <ul>${next.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      </div>
    </div>`;
  document.body.appendChild(ov);
  $("#ov-back",ov).onclick=()=>ov.remove();
}

/* ---------- Escenario interactivo ---------- */
function openScenario(id){
  const e=DB.escenario(id); if(!e) return;
  const L=e[LANG]||e.es;
  const ov=document.createElement("div"); ov.className="overlay";
  ov.innerHTML=`
    <div class="overlay-head"><button class="back-btn" id="sc-back">${ic("chevleft",20)} ${esc(t("back"))}</button></div>
    <div class="pad">
      <h2 style="font-family:var(--font-display);font-weight:800;font-size:1.35rem;letter-spacing:-.02em;margin-bottom:14px;display:flex;align-items:center;gap:10px"><span style="color:${e.color};display:flex">${ic(e.icon,26)}</span>${esc(L.t)}</h2>
      <div class="scn-brief"><div class="label">${esc(t("scn_brief"))}</div><p style="margin-top:6px">${esc(L.brief)}</p></div>
      <div class="section-title">${esc(t("scn_fill"))}</div>
      ${L.fields.map(fieldHTML).join("")}
      <div class="section-title" style="margin-top:8px">${esc(t("scn_decide"))}</div>
      <div class="field"><label>${esc(L.decide.label)}</label>
        <select id="sc-decision">${L.decide.opts.map((o,i)=>`<option value="${i===0?'':esc(o)}">${esc(o)}</option>`).join("")}</select></div>
      <button class="btn btn-primary btn-block" id="sc-check">${esc(t("scn_check"))}</button>
      <div id="sc-fb"></div>
    </div>`;
  document.body.appendChild(ov);
  $("#sc-back",ov).onclick=()=>ov.remove();
  ov.querySelectorAll("select").forEach(s=>{
    s.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); $("#sc-check",ov).click(); } });
  });
  $("#sc-check",ov).onclick=()=>{
    const choice=$("#sc-decision",ov).value;
    const fb=$("#sc-fb",ov);
    if(!choice){ toast(L.decide.label); return; }
    const ok = (choice===L.right);
    fb.innerHTML=`<div class="feedback ${ok?'ok':'warn'}">
      <h4>${ic(ok?'check':'alert',20)} ${esc(ok?L.okhead:L.warnhead)}</h4>
      <p>${esc(ok?L.okmsg:L.warnmsg)}</p></div>`;
    fb.scrollIntoView({behavior:"smooth",block:"center"});
  };
}
function fieldHTML(f){
  if(f.type==="select"){
    return `<div class="doc-block"><div class="doc-tag">${esc(f.label)}</div>
      <select>${f.opts.map((o,i)=>`<option value="${i===0?'':esc(o)}">${esc(o)}</option>`).join("")}</select></div>`;
  }
  return `<div class="doc-block"><div class="doc-tag">${esc(f.label)}</div>
    <textarea placeholder="${esc(f.ph||'')}"></textarea></div>`;
}

/* ----------------------------- Re-render ----------------------------- */
function rerender(){
  document.querySelectorAll(".overlay,.modal-bg").forEach(x=>x.remove());
  if(STATE.user) renderApp(); else renderLanding();
}

/* ----------------------------- Arranque ----------------------------- */
(function boot(){
  const email = _ls.session;
  if(email){
    const u = DB.findUserByEmail(email);
    if(u){ STATE.user = u; renderApp(); return; }
  }
  renderLanding();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./service-worker.js").catch(function(){});
  });
}
</script>
</body>
</html>
