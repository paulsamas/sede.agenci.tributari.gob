<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#005bb5"><link rel="icon" href="icons/192.png"><link rel="apple-touch-icon" href="icons/192.png"><title>Prototipo app tributaria v2</title>
<style>
:root{--bg:#f9faff;--surface:#fff;--ink:#0d1b2a;--blue:#005bb5;--line:#d5dbe6;--zebra:#dfe3ea;--sel:#cfe3ff;--shadow:0 2px 8px rgba(0,30,80,.18);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141c;--surface:#19212d;--ink:#e6ecf5;--blue:#7ab4ff;--line:#2c3748;--zebra:#222c3a;--sel:#1f3a5e;--shadow:0 2px 8px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141c;--surface:#19212d;--ink:#e6ecf5;--blue:#7ab4ff;--line:#2c3748;--zebra:#222c3a;--sel:#1f3a5e;--shadow:0 2px 8px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.4 "Segoe UI",Roboto,system-ui,sans-serif}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
.bar{position:sticky;top:0;z-index:4;background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.15);display:flex;align-items:center;gap:14px;padding:16px 18px;color:var(--blue);font-size:22px}
.bar .sp{flex:1}.bar button{background:none;border:0;color:var(--blue);padding:2px;display:flex;cursor:pointer}
svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo{width:34px;height:34px;display:inline-block;background:var(--blue);clip-path:polygon(0 0,35% 0,100% 100%,65% 100%);margin-right:2px}
main{padding:8px 0 110px}
.sec{display:flex;align-items:center;justify-content:space-between;padding:22px 22px 10px;font-size:23px}
.sec svg{width:34px;height:34px}
.rail{display:flex;gap:14px;overflow-x:auto;padding:6px 22px 14px;scroll-snap-type:x proximity;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.card{flex:none;width:130px;height:150px;background:var(--surface);border:0;border-radius:24px;box-shadow:var(--shadow);color:var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font:inherit;font-size:16px;text-align:center;line-height:1.25;padding:8px;cursor:pointer;scroll-snap-align:start}
.card svg{width:56px;height:56px;stroke-width:2.4}
.card:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.big{display:block;margin:18px;width:calc(100% - 36px);background:var(--surface);border:0;border-radius:24px;box-shadow:var(--shadow);color:var(--blue);font:inherit;font-size:22px;text-align:left;padding:34px 24px;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5;box-shadow:0 -1px 4px rgba(0,0,0,.12)}
nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:10px 6px}
nav button{background:none;border:0;color:var(--ink);font:inherit;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:0}
nav button i{display:flex;padding:4px 22px;border-radius:16px}
nav button[aria-current="page"] i{background:var(--sel)}
.panel{background:var(--surface);margin:16px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.panel h3{margin:0 0 14px;font-size:22px;color:#444;color:var(--ink)}
.box{border:1px solid var(--line);padding:12px}
.box p{text-align:center;margin:0 0 12px;font-size:18px}
table{width:100%;border-collapse:collapse;font-size:18px}
th{background:var(--blue);color:#fff;padding:8px 4px;border:1px solid var(--surface)}
:root[data-theme="dark"] th{color:#06101f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) th{color:#06101f}}
td{padding:9px 6px;border:1px solid var(--surface);text-align:center}
td:first-child{text-align:right}
tr:nth-child(even) td{background:var(--zebra)}
td a{color:var(--blue);text-decoration:underline;cursor:pointer}
.pg{padding:14px 0 0 80px;font-size:22px}.pg a{color:var(--blue);text-decoration:underline;cursor:pointer;padding:0 4px}.pg b{color:#c0272d;text-decoration:underline;padding:0 4px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.on{opacity:1}
.note{margin:18px 22px;font-size:14px;opacity:.7}
</style>
</head>
<body>
<div class="app"><div id="bar" class="bar"></div><main id="v"></main><nav><div id="nav"></div></nav></div>
<div class="toast" id="toast" role="status"></div>
<script>
var I={
cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
edit:'<svg viewBox="0 0 24 24"><path d="M12 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M18 3l3 3-9 9-4 1 1-4z"/></svg>',
info:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
eur:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5a4 4 0 1 0 0 7M7 10.5h6M7 13.5h6"/></svg>',
find:'<svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M15 15l6 6"/></svg>',
hist:'<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4M12 8v4l3 2"/></svg>',
mail:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
usr:'<svg viewBox="0 0 24 24"><circle cx="10" cy="8" r="4"/><path d="M3 20c0-4 3-6 7-6M18 14v6M15 17h6"/></svg>',
back:'<svg viewBox="0 0 24 24"><path d="M20 12H5M11 6l-6 6 6 6"/></svg>',
arr:'<svg viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg>',
help:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17v.5"/></svg>',
person:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M6 19c1-3 3-4 6-4s5 1 6 4"/></svg>',
gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>',
out:'<svg viewBox="0 0 24 24"><path d="M9 4H5v16h4M10 12h10M16 8l4 4-4 4"/></svg>'};
var pays={1:[["685,88 €","20/10/2026"],["27,34 €","02/10/2026"],["873,47 €","10/09/2026"],["457,23 €","14/07/2026"],["63,15 €","05/06/2026"],["148,90 €","22/03/2026"],["3,86 €","09/12/2025"],["31,10 €","06/09/2025"]],2:[["8,67 €","02/05/2025"],["112,58 €","20/02/2025"],["45,20 €","14/10/2024"],["9,15 €","03/07/2024"],["210,40 €","21/06/2024"]]};
function dl(){var a=document.createElement("a");a.href="justificante.pdf";a.download="justificante-pago-20-10-2026.pdf";document.body.appendChild(a);a.click();a.remove();toast("Justificante descargado")}
var st={s:"home",p:1},stack=[];
var tabs=[["home","Gestiones",I.arr.replace(/<path.*<\/svg>/,'<path d="M5 20L12 4l7 16-7-5z"/></svg>')],["av","Avisos",I.mail],["us","Usuarios",I.usr],["inf","Información",I.info]];
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.className="toast on";setTimeout(function(){t.className="toast"},1800)}
function card(i,t,f){return '<button class="card" onclick="'+(f||"toast(\'Pantalla de ejemplo\')")+'">'+i+t+'</button>'}
function sec(t,f){return '<div class="sec"><span>'+t+'</span>'+I.arr+'</div>'}
function nav(s,top){stack.push(st.s);st.s=s;render()}
function back(){st.s=stack.pop()||"home";render()}
function pg(n){st.p=n;render()}
function bar(t,root){
 var b=document.getElementById("bar");
 b.innerHTML=root?'<span class="logo" aria-hidden="true"></span><span>'+t+'</span><span class="sp"></span><button aria-label="Perfil">'+I.person+'</button><button aria-label="Ajustes">'+I.gear+'</button><button aria-label="Salir">'+I.out+'</button>'
 :'<button aria-label="Volver" onclick="back()">'+I.back+'</button><span>'+t+'</span><span class="sp"></span><button aria-label="Ayuda" onclick="toast(\'Ayuda de ejemplo\')">'+I.help+'</button><button aria-label="Perfil">'+I.person+'</button>'}
function render(){
 var h="",s=st.s,root=["home","av","us","inf"].indexOf(s)>-1;
 if(s=="home"){bar("Gestiones",1);
  h=sec("Asistencia y Cita")+'<div class="rail">'+card(I.cal,"Asistencia y Cita")+card(I.edit,"Catálogo de servicios")+card(I.info,"Asistencia virtual")+'</div>'+
  sec("Renta")+'<div class="rail">'+card(I.edit,"Declaración anual")+card(I.hist,"Ejercicios anteriores")+card(I.find,"Presentadas")+'</div>'+
  sec("Deudas")+'<div class="rail">'+card(I.eur,"Pagar")+card(I.cal,"Aplazar")+card(I.find,"Consultar","nav(\'cons\')")+'</div>'+
  sec("Notificaciones y cotejo")+'<div class="rail">'+card(I.mail,"Notificaciones")+card(I.find,"Cotejo de documentos")+'</div>'+
  '<p class="note">Prototipo de concepto con datos ficticios. Sin conexión con sistemas de la Administración.</p>'}
 if(s=="cons"){bar("Consultar");h='<button class="big" onclick="toast(\'Consulta de deudas: ejemplo\')">Consulta de deudas</button><button class="big" onclick="st.p=1;nav(\'pagos\')">Mis pagos</button>'}
 if(s=="pagos"){bar("");h='<div class="panel"><h3>Pagos realizados por un obligado tributario</h3><div class="box"><p>A continuación se muestra un listado con los últimos pagos realizados por el obligado tributario:<br>00000000T</p><table><tr><th>Importe</th><th>Fecha</th><th>Justificante</th></tr>'+
  pays[st.p].map(function(r,i){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td><a role="button" tabindex="0" onclick="'+(st.p==1&&i==0?'dl()':'toast(\'Justificante descargado\')')+'">Descargar</a></td></tr>'}).join("")+'</table></div><div class="pg">'+
  (st.p==1?'<b>1</b><a onclick="pg(2)">2</a>':'<a onclick="pg(1)">«1</a><b>2</b>')+'</div></div>'}
 if(s=="av"){bar("Avisos",1);h='<button class="big" onclick="toast(\'Aviso de ejemplo\')">1 notificación pendiente de abrir</button>'}
 if(s=="us"){bar("Usuarios",1);h='<button class="big" onclick="toast(\'Ejemplo\')">Ana Ejemplo · 00000000T</button>'}
 if(s=="inf"){bar("Información",1);h='<button class="big" onclick="toast(\'Ejemplo\')">Privacidad y tratamiento de datos</button>'}
 document.getElementById("v").innerHTML=h;
 var cur=root?s:"home";
 document.getElementById("nav").innerHTML=tabs.map(function(t){return '<button '+(t[0]==cur?'aria-current="page"':'')+' onclick="stack=[];st.s=\''+t[0]+'\';render()"><i>'+t[2]+'</i>'+t[1]+'</button>'}).join("");
 window.scrollTo(0,0)}
render();
if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
</script>
</body>
</html>
